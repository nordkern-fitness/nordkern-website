name: Nordkern 8.6 LIVE DEV read-only browser integration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-public:
    name: Real DEV read-only Auth / RLS, Chromium Firefox WebKit
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Playwright runner
        run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - name: Install supported Chromium Firefox WebKit browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Execute real read-only DEV HTTP checks, no passwords or mocks
        run: npx playwright test --config browser-tests/live-public.config.cjs
      - name: Publish non-sensitive live-public results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nordkern-8-6-live-public-browser-report
          path: playwright-live-public-report/
          if-no-files-found: ignore
          retention-days: 14
