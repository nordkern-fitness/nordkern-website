name: Nordkern Website Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Website checks and preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Check HTML paths and domain
        run: python3 scripts/check_site.py

      - name: Check JavaScript syntax
        run: |
          node --check js/main.js
          node --check js/catalog.js
          node --check js/studios.js
          node --check js/account.js
          node --check js/account-overview.js
          node --check js/shop.js
          node --check js/shop-cart.js

      - name: Test public catalogue client
        run: node --test tests/*.test.cjs

      - name: Check exposure policy without printing legal name or email
        run: |
          python3 -m unittest discover -s tests -p 'test_privacy_audit.py'
          python3 scripts/privacy_audit.py

      - name: Test local private preview HTTP boundary
        run: python3 -m unittest discover -s tests -p 'test_private_preview.py'

      - name: Build double-click preview
        run: python3 scripts/build_preview.py

      - name: Ensure downloadable preview contains no legal personal name
        run: python3 scripts/privacy_audit.py --preview

      - name: Upload downloadable website preview
        if: github.event.repository.private == true && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Nordkern-Website-Vorschau
          path: preview/
          if-no-files-found: error
          retention-days: 14

      # In a public PR, do not automatically upload another unredacted copy
      # of the entire historical legal source. Manual source export remains.
      - name: Package complete versioned website source
        if: github.event.repository.private == true && github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p release
          git archive --format=zip --output=release/Nordkern-Website-Source.zip HEAD
          unzip -t release/Nordkern-Website-Source.zip

      - name: Upload complete website source
        if: github.event.repository.private == true && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Nordkern-Website-Source
          path: release/Nordkern-Website-Source.zip
          if-no-files-found: error
          retention-days: 14

      # One-time encrypted transfer for the owner's isolated offline preview.
      # The recipient certificate is public; its private key never enters GitHub.
      - name: Encrypt sanitized preview for isolated transfer
        if: github.event_name == 'pull_request'
        run: |
          if ! git log -1 --format=%B "${{ github.event.pull_request.head.sha }}" | grep -Fxq 'NK-PRIVATE-PREVIEW-TRANSFER-20261126'; then exit 0; fi
          mkdir -p "$RUNNER_TEMP/nk-transfer"
          cp browser-tests/fixtures.cjs preview/preview-fixtures.cjs
          git rev-parse HEAD > preview/preview-source.txt
          git rev-parse "${{ github.event.pull_request.head.sha }}" > preview/preview-draft.txt
          python3 scripts/privacy_audit.py --preview
          (cd preview && zip -qr "$RUNNER_TEMP/nk-transfer/source.zip" .)
          openssl cms -encrypt -aes-256-gcm -binary -outform DER -in "$RUNNER_TEMP/nk-transfer/source.zip" -out "$RUNNER_TEMP/nk-transfer/nordkern-preview.cms" scripts/preview-recipient-20261126.pem
          rm -f "$RUNNER_TEMP/nk-transfer/source.zip"
      - name: Upload encrypted preview bytes only
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: nordkern-private-preview-encrypted
          path: ${{ runner.temp }}/nk-transfer/nordkern-preview.cms
          if-no-files-found: ignore
          retention-days: 1
