name: Nordkern Website Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    name: Static site integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Check HTML paths and domain
        run: python3 scripts/check_site.py
