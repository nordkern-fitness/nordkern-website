<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="default-src 'none';script-src 'unsafe-inline';style-src 'unsafe-inline';img-src data:;frame-src 'self' about:;connect-src 'none';form-action 'none';base-uri 'none'"><title>Nordkern Fitness · Private Vorschau</title><style>*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:#e8eee7;color:#17231c;display:flex;flex-direction:column;height:100dvh}.bar{background:#173d28;color:#fff;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.bar b{letter-spacing:.04em}.bar small{color:#cee4d2}button,select{font:inherit;border:1px solid #b6cfbb;border-radius:8px;padding:8px;background:white;color:#173d28;cursor:pointer}#notice{background:#f7e6d2;color:#503214;padding:8px 16px}#notice[hidden]{display:none}iframe{border:0;background:white;width:100%;flex:1;min-height:0}</style></head><body><header class="bar"><b>NORDKERN · PRIVATE VORSCHAU</b><small id="source"></small><button id="back" type="button">← Zurück</button><select id="pages" aria-label="Seite wählen"></select><button id="reset" type="button">Beispieldaten zurücksetzen</button></header><div id="notice" role="status" hidden></div><iframe id="view" title="Nordkern Website" sandbox="allow-scripts allow-forms"></iframe><script>const PACK=__NK_PACK__;
const frame=document.getElementById('view'),select=document.getElementById('pages'),notice=document.getElementById('notice');
document.getElementById('source').textContent='Synthetische Daten · keine echten Vorgänge · Stand '+PACK.source;
let store={},stack=[],current='index.html';
const labels={'index.html':'Startseite','mitgliedschaften.html':'Tarife','standorte.html':'Standorte','app.html':'App','konto.html':'Mitgliederkonto','shop.html':'Shop','kontakt.html':'Kontakt & FAQ','hausordnung.html':'Hausordnung','impressum.html':'Rechtliche Hinweise (gekürzt)'};
for(const [p,label] of Object.entries(labels))if(PACK.pages[p])select.add(new Option(label,p));
const safe=x=>JSON.stringify(x).replaceAll('<','\\u003c');
function show(page,hash='',push=true){if(!Object.hasOwn(PACK.pages,page))return;if(push&&page!==current)stack.push(current);current=page;select.value=page;notice.hidden=true;
 const bootstrap='<script>window.NK_PAGE='+safe(page)+';window.NK_HASH='+safe(hash)+';window.NK_STORE='+safe(store)+';'+PACK.fixture+'\n'+PACK.runtime+'<\/script>';
 frame.srcdoc=PACK.pages[page].replace('__NK_BOOTSTRAP__',()=>bootstrap).replace(/__NK_ASSET:([a-zA-Z0-9./_-]+)__/g,(_,k)=>PACK.assets[k]||'');
}
select.onchange=()=>show(select.value);document.getElementById('back').onclick=()=>show(stack.pop()||'index.html','',false);document.getElementById('reset').onclick=()=>{store={};stack=[];show('index.html','',false)};
addEventListener('message',e=>{if(e.source!==frame.contentWindow||!e.data)return;const d=e.data;if(d.nk==='navigate')show(d.page,d.hash);if(d.nk==='notice'){notice.textContent=String(d.message);notice.hidden=false}if(d.nk==='storage'&&['sessionStorage','localStorage'].includes(d.kind)&&typeof d.key==='string'&&!['__proto__','constructor','prototype'].includes(d.key)){const k=store[d.kind]??={};if(d.value===null)delete k[d.key];else k[d.key]=String(d.value)}if(d.nk==='clear'&&['sessionStorage','localStorage'].includes(d.kind))store[d.kind]={}});
show('index.html','',false);</script></body></html>
